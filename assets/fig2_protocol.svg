<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img" aria-label="MNIST 数据集划分与评估协议示意图">
<title>Dataset partition and evaluation protocol</title>
<desc>60000 张训练图像划分为 55000 训练子集与 5000 验证子集，10000 张测试图像仅在训练结束后用于一次最终评估。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3E86B0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" letter-spacing="1.4" fill="#7C93A5">PROTOCOL · DATA PARTITION AND EVALUATION</text>

<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" text-anchor="middle">
<rect x="40" y="123" width="130" height="56" rx="9" fill="#E4EFF6" stroke="#1F4E79" stroke-width="0.8"/>
<text x="105" y="147" font-size="13" font-weight="500" fill="#1B2F42">MNIST</text>
<text x="105" y="165" font-size="11" fill="#5A7183">70,000 张图像</text>
</g>

<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" text-anchor="middle">
<rect x="210" y="55" width="160" height="48" rx="8" fill="#F4F8FB" stroke="#1F4E79" stroke-width="0.8"/>
<text x="290" y="75" font-size="12.5" font-weight="500" fill="#1B2F42">训练子集 55,000</text>
<text x="290" y="92" font-size="11" fill="#5A7183">参数拟合</text>

<rect x="210" y="127" width="160" height="48" rx="8" fill="#F4F8FB" stroke="#1F4E79" stroke-width="0.8"/>
<text x="290" y="147" font-size="12.5" font-weight="500" fill="#1B2F42">验证子集 5,000</text>
<text x="290" y="164" font-size="11" fill="#5A7183">模型选择</text>

<rect x="210" y="199" width="160" height="48" rx="8" fill="#E9F1F6" stroke="#3E86B0" stroke-width="0.8"/>
<text x="290" y="219" font-size="12.5" font-weight="500" fill="#1B2F42">测试集 10,000</text>
<text x="290" y="236" font-size="11" fill="#5A7183">独立于训练集</text>
</g>

<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
<rect x="420" y="55" width="220" height="48" rx="8" fill="#FAFCFE" stroke="#C9D9E4" stroke-width="0.8"/>
<text x="436" y="75" font-size="12" font-weight="500" fill="#1B2F42">反向传播与参数更新</text>
<text x="436" y="92" font-size="11" fill="#5A7183">每个 batch：zero_grad → backward → step</text>

<rect x="420" y="127" width="220" height="48" rx="8" fill="#FAFCFE" stroke="#C9D9E4" stroke-width="0.8"/>
<text x="436" y="147" font-size="12" font-weight="500" fill="#1B2F42">每轮验证与最佳权重保存</text>
<text x="436" y="164" font-size="11" fill="#5A7183">记录 loss / acc，取验证准确率最高者</text>

<rect x="420" y="199" width="220" height="48" rx="8" fill="#FAFCFE" stroke="#C9D9E4" stroke-width="0.8"/>
<text x="436" y="219" font-size="12" font-weight="500" fill="#1B2F42">训练结束后一次性评估</text>
<text x="436" y="236" font-size="11" fill="#5A7183">报告 test loss 与 top-1 accuracy</text>
</g>

<path d="M170 151 L190 151 L190 79 L208 79" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>
<path d="M170 151 L208 151" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>
<path d="M170 151 L190 151 L190 223 L208 223" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>
<path d="M372 79 L418 79" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>
<path d="M372 151 L418 151" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>
<path d="M372 223 L418 223" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>

<text x="40" y="272" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#5A7183">验证集参与模型选择；测试集不参与训练、超参数调整或早停决策。</text>
</svg>
