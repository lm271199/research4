<svg xmlns="http://www.w3.org/2000/svg" width="680" height="256" viewBox="0 0 680 256" role="img" aria-label="两层感知机的前向传播与损失计算示意图">
<title>Forward pass and loss computation of the two-layer MLP</title>
<desc>输入 28×28 灰度图像经展平、两层全连接与 ReLU 得到 10 维 logits，与真实标签一起计算交叉熵损失。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3E86B0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="30" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" letter-spacing="1.4" fill="#7C93A5">FORWARD PASS · 784 → 128 → 10</text>

<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" text-anchor="middle">
<rect x="40" y="50" width="100" height="56" rx="9" fill="#F4F8FB" stroke="#1F4E79" stroke-width="0.8"/>
<text x="90" y="73" font-size="12.5" font-weight="500" fill="#1B2F42">输入图像</text>
<text x="90" y="91" font-size="11" fill="#5A7183">28×28 灰度</text>

<rect x="165" y="50" width="100" height="56" rx="9" fill="#F4F8FB" stroke="#1F4E79" stroke-width="0.8"/>
<text x="215" y="73" font-size="12.5" font-weight="500" fill="#1B2F42">展平</text>
<text x="215" y="91" font-size="11" fill="#5A7183">view(N, −1)</text>

<rect x="290" y="50" width="100" height="56" rx="9" fill="#E4EFF6" stroke="#1F4E79" stroke-width="0.8"/>
<text x="340" y="73" font-size="12.5" font-weight="500" fill="#1B2F42">全连接 + ReLU</text>
<text x="340" y="91" font-size="11" fill="#5A7183">fc1 → 128</text>

<rect x="415" y="50" width="100" height="56" rx="9" fill="#E4EFF6" stroke="#1F4E79" stroke-width="0.8"/>
<text x="465" y="73" font-size="12.5" font-weight="500" fill="#1B2F42">全连接</text>
<text x="465" y="91" font-size="11" fill="#5A7183">fc2 → 10</text>

<rect x="540" y="50" width="100" height="56" rx="9" fill="#F4F8FB" stroke="#1F4E79" stroke-width="0.8"/>
<text x="590" y="73" font-size="12.5" font-weight="500" fill="#1B2F42">输出 logits</text>
<text x="590" y="91" font-size="11" fill="#5A7183">未归一化</text>
</g>

<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" text-anchor="middle" font-size="11" fill="#7C93A5">
<text x="90" y="126">[N, 1, 28, 28]</text>
<text x="215" y="126">[N, 784]</text>
<text x="340" y="126">[N, 128]</text>
<text x="465" y="126">[N, 10]</text>
<text x="590" y="126">类别 0–9</text>
</g>

<path d="M142 78 L161 78" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>
<path d="M267 78 L286 78" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>
<path d="M392 78 L411 78" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>
<path d="M517 78 L536 78" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>

<g font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" text-anchor="middle">
<rect x="60" y="166" width="130" height="40" rx="8" fill="#F4F8FB" stroke="#7FA8C4" stroke-width="0.8"/>
<text x="125" y="190" font-size="12" font-weight="500" fill="#1B2F42">真实标签 y</text>

<rect x="280" y="162" width="200" height="48" rx="8" fill="#E4EFF6" stroke="#1F4E79" stroke-width="0.8"/>
<text x="380" y="181" font-size="12.5" font-weight="500" fill="#1B2F42">交叉熵损失 ℒ</text>
<text x="380" y="198" font-size="11" fill="#5A7183">F.cross_entropy(logits, y)</text>
</g>

<path d="M192 186 L278 186" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>
<path d="M590 106 L590 144 L480 144 L480 160" fill="none" stroke="#3E86B0" stroke-width="1.1" marker-end="url(#arrow)"/>

<text x="40" y="236" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#5A7183">输出为未归一化 logits；softmax 与对数运算由交叉熵损失在数值稳定的形式下内部完成。</text>
</svg>
